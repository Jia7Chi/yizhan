[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yizhan"
version = "0.1.0.dev0"
description = "Let Claude Code and Codex on all your computers work as one team: letters, receipts and decisions carried by a plain git repository."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "yizhan contributors"}]
dependencies = []
keywords = ["ai-agents", "claude-code", "codex", "multi-agent", "collaboration", "git", "hooks", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/Jia7Chi/yizhan"
Issues = "https://github.com/Jia7Chi/yizhan/issues"

[project.scripts]
yizhan = "yizhan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
